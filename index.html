<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070D"><title>H store</title><meta name="description" content="H store: ملابس بتصميم مختلف. اطلب من موبايلك وادفع عند الاستلام أو إنستا باي."><meta property="og:title" content="H store"><meta property="og:description" content="ملابس بتصميم مختلف. اطلب من موبايلك وادفع عند الاستلام أو إنستا باي."><meta property="og:type" content="website"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Reem+Kufi:wght@500;700&family=Unbounded:wght@500;700&display=swap"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><style>
/* Layout concept: dark HUD storefront. One bold moment (pointer-reactive dot-wave field + hologram garment in the hero), everything else quiet: hairline frames, mono labels, one ice accent. Single dark world by choice. */
:root{
  --bg:#05070D; --bg-2:#090D18; --surface:#0D1322; --surface-2:#141C33;
  --line:#1E2A49; --line-2:#2D3C66;
  --fg:#E8EDFA; --muted:#8E99B8;
  --accent:#7BDFFF; --accent-ink:#031019;
  --warn:#FFC46B; --danger:#FF7390; --ok:#62F0B4;
  --holo:linear-gradient(105deg,#6CE6FF 0%,#8E86FF 38%,#FF9AD2 72%,#FFD9A6 100%);
  --holo-loop:linear-gradient(105deg,#6CE6FF,#8E86FF,#FF9AD2,#FFD9A6,#FF9AD2,#8E86FF,#6CE6FF);
  --f-display:"Reem Kufi","Unbounded",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.app{--dir:-1;position:relative;min-height:100vh;overflow-x:clip}
.app[lang="en"]{--dir:1;--f-display:"Unbounded","Reem Kufi",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,p,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.display{font-family:var(--f-display)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lat{font-family:var(--f-mono);letter-spacing:.16em;text-transform:uppercase}
.app[lang="en"] .mono.up{letter-spacing:.12em;text-transform:uppercase}

.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(55% 38% at 85% -5%,rgba(120,134,255,.16),transparent 70%),radial-gradient(45% 35% at 0% 28%,rgba(108,230,255,.08),transparent 70%)}
.ambient::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.22;-webkit-mask-image:radial-gradient(70% 60% at 50% 20%,#000,transparent);mask-image:radial-gradient(70% 60% at 50% 20%,#000,transparent)}
main,.foot,.demo{position:relative;z-index:1}

/* intro splash: removes itself with CSS only */
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);animation:introOut .45s ease 1.25s forwards}
.intro-core{display:grid;justify-items:center;gap:1.2rem}
.intro .bar{width:160px;height:2px;background:var(--line-2);overflow:hidden}
.intro .bar i{display:block;height:100%;background:var(--holo);transform-origin:left;animation:load 1.1s cubic-bezier(.6,0,.2,1) both}
.intro p{font-size:.7rem;color:var(--muted)}
@keyframes introOut{to{opacity:0;visibility:hidden}}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* logo mark */
.hex{--s:40px;position:relative;display:grid;place-items:center;width:var(--s);height:calc(var(--s)*1.12);background:var(--holo);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);flex:none}
.hex::before{content:"";position:absolute;inset:2px;background:var(--bg-2);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.hex b{position:relative;font-family:"Unbounded",var(--f-display);font-weight:700;font-size:calc(var(--s)*.44);line-height:1;background:var(--holo);-webkit-background-clip:text;background-clip:text;color:transparent}
.hex.big{--s:88px}

.demo{background:rgba(255,196,107,.08);border-bottom:1px dashed rgba(255,196,107,.45);color:var(--warn);font-size:.82rem;text-align:center;padding-block:.5rem}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(5,7,13,.74);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:68px}
.brand{display:flex;align-items:center;gap:.75rem;text-decoration:none;min-width:0}
.brand-name{font-weight:700;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:1.6rem;color:var(--muted);font-size:.95rem}
.nav a{text-decoration:none;padding-block:.4rem}
.nav a:hover{color:var(--fg)}
.tools{display:flex;gap:.5rem}
.icon-btn{position:relative;display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 .6rem;background:transparent;border:1px solid var(--line-2);border-radius:2px;font-family:var(--f-mono);font-size:.82rem;transition:border-color .2s,background .2s}
.icon-btn:hover{border-color:var(--accent);background:rgba(123,223,255,.06)}
.count{position:absolute;top:-7px;inset-inline-end:-7px;min-width:20px;height:20px;padding:0 5px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:.7rem;font-weight:500;border-radius:10px}
@media(max-width:640px){.nav{display:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:0 1.5rem;border:0;font-weight:600;text-decoration:none;transition:background .2s,border-color .2s,transform .15s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--fg);color:var(--bg);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.btn.primary:hover{background:var(--holo)}
.btn.ghost{background:transparent;border:1px solid var(--line-2);border-radius:2px}
.btn.ghost:hover{border-color:var(--accent);background:rgba(123,223,255,.06)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
#field{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,transparent 22%,#000 66%);mask-image:linear-gradient(180deg,transparent 22%,#000 66%)}
.hero-in{position:relative;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:2.5rem;padding-block:clamp(2.5rem,7vw,5.5rem) clamp(2.5rem,6vw,4.5rem)}
.hero-copy{min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:.7rem;font-size:.78rem;color:var(--accent)}
.eyebrow::before{content:"";width:8px;height:8px;background:var(--accent);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(123,223,255,.55)}100%{box-shadow:0 0 0 12px rgba(123,223,255,0)}}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2.7rem,8.5vw,5.6rem);line-height:1.05;margin:.9rem 0 1.2rem;text-wrap:balance}
.app[lang="ar"] .hero h1{line-height:1.3}
.hero h1 span{display:block}
.holo-text{background:var(--holo-loop);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.lead{max-width:34rem;color:var(--muted);font-size:1.1rem}
.cta{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.9rem}
.facts{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:2rem}
.facts li{display:flex;align-items:center;gap:.55rem;padding:.4rem .85rem;border:1px solid var(--line-2);color:var(--muted);font-size:.84rem;background:rgba(9,13,24,.6)}
.facts li::before{content:"";width:6px;height:6px;background:var(--accent)}

.holo{--rx:0deg;--ry:0deg;position:relative;width:100%;max-width:420px;margin-inline:auto;aspect-ratio:1/1.05;perspective:900px}
.holo-in{position:absolute;inset:0;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .18s ease-out;border:1px solid var(--line-2);background:linear-gradient(160deg,rgba(20,28,51,.78),rgba(9,13,24,.6));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:hidden;display:grid;place-items:center}
.holo-in svg{width:78%;filter:drop-shadow(0 0 18px rgba(108,230,255,.38));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-9px)}}
.scan{position:absolute;inset-inline:0;top:-90px;height:90px;background:linear-gradient(180deg,transparent,rgba(123,223,255,.22),transparent);animation:scan 4.6s linear infinite;pointer-events:none}
@keyframes scan{to{top:100%}}
.holo::before{content:"";position:absolute;inset:-7px;z-index:2;pointer-events:none;background:
 linear-gradient(var(--accent),var(--accent)) 0 0/16px 1px no-repeat,linear-gradient(var(--accent),var(--accent)) 0 0/1px 16px no-repeat,
 linear-gradient(var(--accent),var(--accent)) 100% 0/16px 1px no-repeat,linear-gradient(var(--accent),var(--accent)) 100% 0/1px 16px no-repeat,
 linear-gradient(var(--accent),var(--accent)) 0 100%/16px 1px no-repeat,linear-gradient(var(--accent),var(--accent)) 0 100%/1px 16px no-repeat,
 linear-gradient(var(--accent),var(--accent)) 100% 100%/16px 1px no-repeat,linear-gradient(var(--accent),var(--accent)) 100% 100%/1px 16px no-repeat}
.hud{position:absolute;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.hud.tl{top:.8rem;inset-inline-start:.9rem}
.hud.br{bottom:.8rem;inset-inline-end:.9rem}
@media(max-width:820px){.hero-in{grid-template-columns:1fr}.holo{max-width:300px}}

.ticker{position:relative;z-index:1;border-bottom:1px solid var(--line);overflow:hidden;background:var(--bg-2);direction:ltr}
.tick-track{display:flex;width:max-content;animation:mq 36s linear infinite}
.tick-track span{display:inline-flex;align-items:center;padding:.75rem 0;white-space:nowrap;font-family:var(--f-mono);font-size:.75rem;letter-spacing:.14em;color:var(--muted)}
.tick-track span.ar{font-family:var(--f-body);letter-spacing:0;font-size:.85rem}
.tick-track span::after{content:"";width:6px;height:6px;margin-inline:1.8rem;background:var(--line-2);transform:rotate(45deg)}
@keyframes mq{to{transform:translateX(-50%)}}

section{padding-block:clamp(3rem,7vw,5.5rem);scroll-margin-top:72px}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1.2rem;margin-bottom:2rem}
.sec-head h2{font-family:var(--f-display);font-size:clamp(1.8rem,4.6vw,2.7rem);line-height:1.25;margin:.4rem 0;text-wrap:balance}
.sec-head p{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{min-height:42px;padding:0 1.1rem;background:transparent;border:1px solid var(--line-2);border-radius:2px;color:var(--muted);transition:background .2s,color .2s,border-color .2s}
.chip:hover{color:var(--fg);border-color:var(--accent)}
.chip[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:1.1rem}
.card{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:4px;transition:transform .2s ease-out,border-color .2s;will-change:transform}
.card:hover{border-color:var(--line-2)}
.tile{position:relative;aspect-ratio:1/.92;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(70% 62% at 50% 42%,rgba(123,223,255,.12),transparent 72%)}
.tile::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:26px 26px;opacity:.4;-webkit-mask-image:radial-gradient(60% 60% at 50% 45%,#000,transparent);mask-image:radial-gradient(60% 60% at 50% 45%,#000,transparent)}
.tile svg{position:relative;width:66%;transition:transform .35s ease}
.card:hover .tile svg{transform:scale(1.06) translateY(-3px)}
.kind{position:absolute;top:.75rem;inset-inline-start:.85rem;font-size:.66rem;color:var(--muted)}
.info{display:flex;flex-direction:column;gap:.8rem;flex:1;padding:1rem 1rem 1.1rem}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem}
.row h3{min-width:0;font-size:1.05rem;font-weight:600;line-height:1.4}
.price{white-space:nowrap;color:var(--accent);font-size:.95rem}
.desc{color:var(--muted);font-size:.9rem}
.opts{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem}
.swatches{display:flex;gap:.6rem}
.sw{position:relative;width:26px;height:26px;padding:0;border-radius:50%;background:var(--c);border:1px solid var(--line-2)}
.sw::after{content:"";position:absolute;inset:-9px}
.sw[aria-checked="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent)}
.sizes{display:flex;gap:.35rem}
.sz{min-width:38px;height:36px;padding:0 .45rem;background:transparent;border:1px solid var(--line-2);border-radius:2px;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.sz[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(123,223,255,.08)}
.card .add{margin-top:auto}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem}
.step{padding:1.4rem 1.3rem 1.6rem;border:1px solid var(--line);background:var(--bg-2);border-radius:4px}
.step .lat{font-size:.72rem;color:var(--accent)}
.step h3{margin:.7rem 0 .35rem;font-family:var(--f-display);font-size:1.3rem;line-height:1.3}
.step p{color:var(--muted)}
@media(max-width:760px){.steps{grid-template-columns:1fr}}

.foot{border-top:1px solid var(--line);padding-block:2rem}
.foot-in{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1rem;color:var(--muted);font-size:.85rem}

/* drawer */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(2,4,9,.66);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.scrim.open{opacity:1;visibility:visible}
.drawer{position:fixed;z-index:70;inset-block:0;inset-inline-end:0;width:min(450px,100%);display:flex;flex-direction:column;background:var(--surface);border-inline-start:1px solid var(--line-2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);transform:translateX(calc(var(--dir)*105%));visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility .32s}
.drawer.open{transform:none;visibility:visible}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}
.dr-head h2{font-family:var(--f-display);font-size:1.25rem}
.dr-body{flex:1;overflow:auto;padding:1.1rem 1.2rem;overscroll-behavior:contain}
.dr-foot{display:grid;gap:.7rem;padding:1rem 1.2rem;border-top:1px solid var(--line);background:var(--bg-2)}
.dr-foot:empty{display:none}
.empty{display:grid;justify-items:center;gap:.8rem;text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty h3{color:var(--fg);font-size:1.15rem}
.lines{display:grid;gap:.9rem}
.line{display:grid;grid-template-columns:72px 1fr auto;gap:.9rem;align-items:center;padding:.8rem;border:1px solid var(--line);background:var(--bg-2);border-radius:4px}
.thumb{display:grid;place-items:center;aspect-ratio:1;background:radial-gradient(70% 70% at 50% 45%,rgba(123,223,255,.12),transparent 75%);border:1px solid var(--line)}
.thumb svg{width:82%}
.ln{min-width:0;display:grid;gap:.25rem}
.ln-n{font-weight:600;line-height:1.35}
.ln-m{font-size:.76rem;color:var(--muted)}
.qty{display:inline-flex;align-items:center;gap:.2rem;margin-top:.25rem}
.qty button{width:34px;height:34px;display:grid;place-items:center;background:transparent;border:1px solid var(--line-2);border-radius:2px;font-size:1.1rem;line-height:1}
.qty button:hover{border-color:var(--accent)}
.qty span{min-width:28px;text-align:center;font-size:.9rem}
.ln-r{display:grid;justify-items:end;gap:.5rem;align-self:stretch;align-content:space-between}
.ln-r .mono{font-size:.88rem;color:var(--accent);white-space:nowrap}
.rm{background:transparent;border:0;padding:.3rem 0;color:var(--muted);font-size:.8rem;text-decoration:underline}
.rm:hover{color:var(--danger)}
.sum{display:grid;gap:.4rem}
.sum div{display:flex;justify-content:space-between;color:var(--muted);font-size:.92rem}
.sum .tot{color:var(--fg);font-weight:600;font-size:1.08rem;padding-top:.5rem;border-top:1px dashed var(--line-2)}
.sum .mono{white-space:nowrap}
.fld{display:grid;gap:.35rem;margin-bottom:1rem}
.fld label{font-size:.85rem;color:var(--muted)}
.fld label i{font-style:normal;color:var(--muted);opacity:.7}
.fld input,.fld select,.fld textarea{width:100%;min-height:48px;padding:.65rem .8rem;background:var(--bg);border:1px solid var(--line-2);border-radius:2px}
.fld textarea{min-height:86px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(123,223,255,.16)}
.fld[data-bad="1"] input,.fld[data-bad="1"] select,.fld[data-bad="1"] textarea{border-color:var(--danger)}
.fld .err{font-size:.8rem;color:var(--danger)}
.app[dir="rtl"] input[dir="ltr"]{text-align:right}
.pay-title{font-size:.85rem;color:var(--muted);margin-bottom:.4rem}
.pay-opts{display:grid;gap:.6rem}
.pay-opt{position:relative;display:flex;gap:.8rem;align-items:flex-start;padding:.85rem 1rem;border:1px solid var(--line-2);border-radius:2px;cursor:pointer;transition:border-color .2s,background .2s}
.pay-opt:has(input:checked){border-color:var(--accent);background:rgba(123,223,255,.06)}
.pay-opt input{position:absolute;opacity:0;pointer-events:none}
.pay-dot{flex:none;width:18px;height:18px;margin-top:.28rem;border:1.5px solid var(--line-2);border-radius:50%}
.pay-opt input:checked + .pay-dot{border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 10px var(--accent)}
.pay-opt input:focus-visible + .pay-dot{outline:2px solid var(--accent);outline-offset:3px}
.pay-opt strong{display:block}
.pay-opt span span{color:var(--muted);font-size:.88rem}
.insta-box{display:grid;gap:.6rem;margin-top:.7rem;padding:.9rem 1rem;border:1px dashed var(--accent);color:var(--muted);font-size:.9rem}
.insta-num{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem}
.insta-num .mono{font-size:1.25rem;color:var(--fg);letter-spacing:.04em}
.insta-num .btn{min-height:40px;padding:0 1rem}
.insta-box b{color:var(--fg)}
.pay{display:flex;gap:.8rem;align-items:flex-start;padding:.9rem 1rem;border:1px solid var(--accent);background:rgba(123,223,255,.06);border-radius:2px}
.pay svg{flex:none;margin-top:.2rem}
.pay strong{display:block}
.pay span{color:var(--muted);font-size:.88rem}
.done{display:grid;gap:1rem;justify-items:center;text-align:center}
.done h3{font-family:var(--f-display);font-size:1.5rem}

let cart=[];
function loadCart(){try{
  const raw=JSON.parse(localStorage.getItem('store_cart_v2')||'[]');
  if(Array.isArray(raw)){
    cart=raw.filter(i=>{
      const p=i&&byId[i.pid];if(!p||p.out||!(i.qty>0))return false;
      const sizeOk=p.sizes.length?p.sizes.indexOf(i.size)>-1:i.size==='';
      const colorOk=p.colors.length?(Number.isInteger(i.ci)&&i.ci>=0&&!!p.colors[i.ci]):i.ci===-1;
      return sizeOk&&colorOk;
    }).map(i=>({pid:i.pid,size:i.size,ci:i.ci,qty:Math.min(10,Math.floor(i.qty))}));
  }
}catch(e){cart=[];}}
function saveCart(){try{localStorage.setItem('store_cart_v2',JSON.stringify(cart));}catch(e){}}

let filter='all',view='cart',lastOrder=null,lastFocus=null,toastTimer=0;
const sel={};
const draft={name:'',phone:'',gov:'',addr:'',notes:'',pay:'cod'};
function selOf(p){return sel[p.id]||(sel[p.id]={ci:p.colors.length?0:-1,size:p.sizes.length?p.sizes[Math.min(1,p.sizes.length-1)]:''});}
const keyOf=i=>i.pid+'|'+i.size+'|'+i.ci;
function totals(){const sub=cart.reduce((a,i)=>a+byId[i.pid].price*i.qty,0);const ship=sub>0?S.ship:0;return{sub:sub,ship:ship,total:sub+ship};}
const qtyAll=()=>cart.reduce((a,i)=>a+i.qty,0);
function tileHTML(p,hex){return p.img?'<img src="'+p.img+'" alt="'+esc(pn(p))+'" decoding="async">':garment(p.kind,hex);}

/* ---------- language ---------- */
function applyLang(){
  app.lang=lang;app.dir=lang==='ar'?'rtl':'ltr';
  document.documentElement.lang=lang;document.documentElement.dir=app.dir;
  $$('[data-i18n]').forEach(el=>{el.textContent=t(el.getAttribute('data-i18n'));});
  $$('[data-i18n-aria]').forEach(el=>{el.setAttribute('aria-label',t(el.getAttribute('data-i18n-aria')));});
  $$('.brand-name').forEach(el=>{el.textContent=lang==='ar'?S.nameAr:S.nameEn;});
  $$('.hl').forEach(el=>{el.textContent=S.logo;});
  document.title=S.nameEn;
  $('#lang-btn').textContent=lang==='ar'?'EN':'ع';
  $('#toast-cart').textContent=t('view_cart');
  const demo=$('#demo');if(demo)demo.hidden=!S.demo;
  renderFilters();renderProducts();updateCount();
  if($('#drawer').classList.contains('open'))renderDrawer();
}

/* ---------- products ---------- */
function renderFilters(){
  const have=CATS.filter(c=>P.some(p=>p.cat===c));
  const box=$('#filters');
  if(have.length<2){box.innerHTML='';filter='all';return;}
  if(filter!=='all'&&have.indexOf(filter)<0)filter='all';
  const list=[['all','f_all']].concat(have.map(c=>[c,'f_'+c]));
  box.innerHTML=list.map(f=>'<button type="button" class="chip" data-f="'+f[0]+'" aria-pressed="'+(filter===f[0])+'">'+t(f[1])+'</button>').join('');
}
function cardHTML(p){
  const s=selOf(p);const c=s.ci>=0?p.colors[s.ci]:null;
  const hex=c?c.hex:'#171A24';
  const sw=p.colors.length?'<div class="swatches" role="radiogroup" aria-label="'+t('color')+'">'+p.colors.map((cc,i)=>'<button type="button" class="sw" role="radio" aria-checked="'+(i===s.ci)+'" aria-label="'+esc(cn(cc))+'" data-act="color" data-i="'+i+'" style="--c:'+esc(cc.hex)+'"></button>').join('')+'</div>':'';
  const sz=p.sizes.length?'<div class="sizes" role="group" aria-label="'+t('size')+'">'+p.sizes.map(z=>'<button type="button" class="sz" aria-pressed="'+(z===s.size)+'" data-act="size" data-v="'+esc(z)+'">'+esc(z)+'</button>').join('')+'</div>':'';
  const desc=pd(p);
  return '<article class="card" data-id="'+esc(p.id)+'">'
   +'<div class="tile">'+tileHTML(p,hex)+'<span class="kind lat">'+t('f_'+p.cat)+'</span>'+(p.out?'<span class="sold">'+t('sold')+'</span>':'')+'</div>'
   +'<div class="info">'
   +'<div class="row"><h3>'+esc(pn(p))+'</h3><span class="price mono">'+money(p.price)+'</span></div>'
   +(desc?'<p class="desc">'+esc(desc)+'</p>':'')
   +((sw||sz)?'<div class="opts">'+sw+sz+'</div>':'')
   +'<button type="button" class="btn ghost wide add" data-act="add"'+(p.out?' disabled':'')+'>'+(p.out?t('sold'):t('add'))+'</button>'
   +'</div></article>';
}
function renderProducts(){
  const list=P.filter(p=>filter==='all'||p.cat===filter);
  $('#grid').innerHTML=list.length?list.map(cardHTML).join(''):'<div class="empty"><h3>'+t('soon')+'</h3></div>';
}
$('#filters').addEventListener('click',e=>{
  const b=e.target.closest('[data-f]');if(!b)return;
  filter=b.getAttribute('data-f');renderFilters();renderProducts();
});
$('#grid').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const card=b.closest('.card');if(!card)return;
  const p=byId[card.getAttribute('data-id')];if(!p)return;
  const s=selOf(p);
  const act=b.getAttribute('data-act');
  if(act==='color'){
    s.ci=+b.getAttribute('data-i');
    $$('.sw',card).forEach((x,i)=>x.setAttribute('aria-checked',String(i===s.ci)));
    const svg=$('.tile svg',card);if(svg)svg.style.setProperty('--g',p.colors[s.ci].hex);
  }else if(act==='size'){
    s.size=b.getAttribute('data-v');
    $$('.sz',card).forEach(x=>x.setAttribute('aria-pressed',String(x.getAttribute('data-v')===s.size)));
  }else if(act==='add'){
    addToCart(p.id,s.size,s.ci);
    b.textContent=t('added');
    clearTimeout(b._t);b._t=setTimeout(()=>{b.textContent=t('add');},1300);
  }
});
(function(){
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const grid=$('#grid');let cur=null;
  function reset(el){if(el)el.style.transform='';}
  grid.addEventListener('pointermove',e=>{
    const c=e.target.closest('.card');
    if(c!==cur){reset(cur);cur=c;}
    if(!c)return;
    const r=c.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    c.style.transform='perspective(900px) rotateX('+(-y*5).toFixed(2)+'deg) rotateY('+(x*6).toFixed(2)+'deg)';
  });
  grid.addEventListener('pointerleave',()=>{reset(cur);cur=null;});
})();

/* ---------- cart ---------- */
function addToCart(pid,size,ci){
  const k=pid+'|'+size+'|'+ci;
  const ex=cart.find(i=>keyOf(i)===k);
  if(ex)ex.qty=Math.min(10,ex.qty+1);else cart.push({pid:pid,size:size,ci:ci,qty:1});
  saveCart();updateCount();showToast();
}
function updateCount(){
  const q=qtyAll();const c=$('#count');
  c.textContent=num(q);c.hidden=q===0;
}
function showToast(){
  $('#toast-msg').textContent=t('toast_added');
  const el=$('#toast');el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}
$('#toast-cart').addEventListener('click',()=>{$('#toast').classList.remove('show');openDrawer('cart');});

function openDrawer(v){
  view=v||'cart';renderDrawer();
  lastFocus=document.activeElement;
  $('#drawer').classList.add('open');$('#scrim').classList.add('open');
  document.body.classList.add('lock');

function closeDrawer(){
  $('#drawer').classList.remove('open');$('#scrim').classList.remove('open');

}

function normPhone(v){return digits(v).replace(/[^\d+]/g,'').replace(/^\+?20(?=1)/,'0');}
const phoneOk=s=>/^01[0125]\d{8}$/.test(s);
function buildOrder(id,d,items){
  const n=x=>Number(x).toLocaleString('en-US');
  let sub=0;
  const L=['طلب جديد #'+id,'','الاسم: '+d.name,'الموبايل: '+d.phone,'المحافظة: '+GOVS[+d.gov][0],'العنوان: '+d.addr,'','المنتجات:'];
  items.forEach(i=>{
    const p=byId[i.pid],c=i.ci>=0?p.colors[i.ci]:null;
    sub+=p.price*i.qty;
    const extra=[i.size?'مقاس '+i.size:'',c?(c.n.ar||c.n.en):''].filter(Boolean).join(' | ');
    L.push('- '+(p.n.ar||p.n.en)+(extra?' | '+extra:'')+' × '+i.qty+' = '+n(p.price*i.qty)+' جنيه');
  });
  const ship=sub>0?S.ship:0;
  L.push('','إجمالي المنتجات: '+n(sub)+' جنيه','الشحن: '+n(ship)+' جنيه','الإجمالي: '+n(sub+ship)+' جنيه','طريقة الدفع: '+(d.pay==='insta'?'تحويل إنستا باي (هيبعت صورة التحويل)':'عند الاستلام'));
  if(d.notes)L.push('ملاحظات: '+d.notes);
  return L.join('\n');
}

function collectOrder(){
  draft.name=$('#f-name').value.trim();
  draft.phone=normPhone($('#f-phone').value);
  draft.gov=$('#f-gov').value;
  draft.addr=$('#f-addr').value.trim();
  draft.notes=$('#f-notes').value.trim();
  const bad=[];
  if(draft.name.length<2)bad.push(['name','err_name']);
  if(!phoneOk(draft.phone))bad.push(['phone','err_phone']);
  if(draft.gov==='')bad.push(['gov','err_gov']);
  if(draft.addr.length<6)bad.push(['addr','err_addr']);
  ['name','phone','gov','addr'].forEach(k=>setErr(k,''));
  if(bad.length){
    bad.forEach(b=>setErr(b[0],t(b[1])));
    const first=$('#f-'+bad[0][0]);if(first)first.focus();
    return null;
  }
  const id=Date.now().toString(36).slice(-5).toUpperCase();
  const snapshot=cart.map(i=>({pid:i.pid,size:i.size,ci:i.ci,qty:i.qty}));
  if(!snapshot.length)return null;
  return {id:id,pay:draft.pay,mode:hasNotify?'notify':(hasWA?'wa':'copy'),text:buildOrder(id,draft,snapshot)};
}

  const key=li?li.getAttribute('data-key'):null;
  const item=key?cart.find(i=>keyOf(i)===key):null;
  if(act==='inc'&&item){item.qty=Math.min(10,item.qty+1);}
  else if(act==='dec'&&item){item.qty-=1;if(item.qty<=0)cart=cart.filter(i=>i!==item);}
  else if(act==='rm'&&item){cart=cart.filter(i=>i!==item);}
  else if(act==='checkout'){view='form';renderDrawer();return;}
  else if(act==='back'){view='cart';renderDrawer();return;}
  else if(act==='shop'){closeDrawer();const p=$('#products');if(p)p.scrollIntoView({behavior:'smooth'});return;}
  else if(act==='new'){view='cart';renderDrawer();return;}
  else if(act==='copynum'){copyNum(b);return;}
  else if(act==='copy'){copyOrder(b);return;}
  else return;
  saveCart();updateCount();renderDrawer();
  if(key&&(act==='inc'||act==='dec')){
    const again=$('[data-key="'+key+'"] [data-act="'+act+'"]');if(again)again.focus();

});

(function(){
  const hero=$('#home'),cv=$('#field'),holo=$('#holo');
  if(!hero||!cv||!cv.getContext)return;
  const ctx=cv.getContext('2d');if(!ctx)return;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
  const COLS=70,ROWS=36;
  const colors=Array.from({length:COLS},(_,c)=>'hsl('+Math.round(188+c/COLS*120)+',95%,72%)');
  let W=0,H=0,t0=0,px=.5,pt=.5,run=false,raf=0,visible=true;
  function size(){
    const d=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();
    W=r.width;H=r.height;
    cv.width=Math.max(1,Math.round(W*d));cv.height=Math.max(1,Math.round(H*d));
    ctx.setTransform(d,0,0,d,0,0);
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const hz=H*.5,span=H-hz;
    px+=(pt-px)*.07;
    for(let r=0;r<ROWS;r++){
      const d=r/(ROWS-1),k=Math.pow(1-d,1.9),sc=.12+.88*Math.pow(1-d,1.25);
      const y0=hz+span*k,sp=(W*1.55/COLS)*sc,amp=26*sc,dot=.6+1.8*sc;
      ctx.globalAlpha=Math.min(1,.1+.85*sc);
      for(let c=0;c<COLS;c++){
        const x=W*.5+(c-COLS/2)*sp;
        if(x<-6||x>W+6)continue;
        const dx=c/COLS-px;
        const y=y0-amp*Math.sin(c*.28+t0*1.1+d*7)*(.6+.4*Math.cos(c*.11-t0*.6))-34*sc*Math.exp(-dx*dx*40);
        ctx.fillStyle=colors[c];
        ctx.fillRect(x-dot/2,y-dot/2,dot,dot);
      }
    }
    ctx.globalAlpha=1;
  }
  function loop(){if(!run)return;t0+=.016;draw();raf=requestAnimationFrame(loop);}
  function start(){if(run||reduce||!visible||document.hidden)return;run=true;raf=requestAnimationFrame(loop);}
  function stop(){run=false;cancelAnimationFrame(raf);}
  size();draw();
  window.addEventListener('resize',()=>{size();draw();});
  if('IntersectionObserver' in window){
    new IntersectionObserver(es=>{visible=es[0].isIntersecting;visible?start():stop();}).observe(hero);
  }else start();
  document.addEventListener('visibilitychange',()=>{document.hidden?stop():start();});
  start();
  if(fine&&!reduce){
    hero.addEventListener('pointermove',e=>{
      const r=hero.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      pt=x;
      if(holo){holo.style.setProperty('--ry',((x-.5)*14).toFixed(2)+'deg');holo.style.setProperty('--rx',(-(y-.5)*10).toFixed(2)+'deg');}
    });
    hero.addEventListener('pointerleave',()=>{pt=.5;if(holo){holo.style.setProperty('--ry','0deg');holo.style.setProperty('--rx','0deg');}});
  }
})();

function toDataUrl(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const MAX=900;let w=im.naturalWidth,h=im.naturalHeight;
      if(!w||!h){URL.revokeObjectURL(url);rej(new Error('img'));return;}
      const k=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};
    im.src=url;
  });
}

function renderBody(){
  const b=$('#adm-body');if(!b)return;
  $$('.adm-tabs button').forEach(x=>x.setAttribute('aria-pressed',String(x.getAttribute('data-tab')===A.tab)));
  let inner;
  if(A.tab==='settings')inner=settingsHTML();
  else if(A.tab==='link')inner=linkHTML();
  else if(A.edit>=0&&W.products[A.edit])inner=editHTML(W.products[A.edit]);
  else{A.edit=-1;inner=listHTML();}
  b.innerHTML='<div class="adm-in">'+inner+'</div>';
}
function validate(){
  for(let i=0;i<W.products.length;i++){
    const p=W.products[i];
    if(!str(p.n.ar)&&!str(p.n.en)){A.tab='products';A.edit=i;renderBody();return 'اكتب اسم المنتج.';}
    if(!(Number(p.price)>0)){A.tab='products';A.edit=i;renderBody();return 'اكتب سعر المنتج (أكبر من صفر).';}
  }
  const wa=str(W.s.wa);
  if(wa&&!waNum(wa)){A.tab='settings';renderBody();return 'رقم الواتساب مش صحيح. اكتبه زي 01012345678.';}
  if(str(W.s.cbKey)&&!waNum(wa)){A.tab='settings';renderBody();return 'علشان الإرسال التلقائي لازم تكتب رقم واتساب صحيح.';}
  return '';
}

/* ---- GitHub commit ---- */
function b64utf8(s){
  const bytes=new TextEncoder().encode(s);let bin='';const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(bin);
}
function ghReq(method,path,body){
  const h={'Accept':'application/vnd.github+json','Authorization':'Bearer '+GH.token,'X-GitHub-Api-Version':'2022-11-28'};
  if(body)h['Content-Type']='application/json';
  return fetch('https://api.github.com/repos/'+GH.repo+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined});
}
async function putFile(path,contentB64,message){
  const enc=path.split('/').map(encodeURIComponent).join('/');
  let sha;
  const g=await ghReq('GET','/contents/'+enc+'?ref='+encodeURIComponent(GH.branch));
  if(g.status===200){const j=await g.json();sha=j.sha;}
  else if(g.status!==404)throw {status:g.status};
  const body={message:message,content:contentB64,branch:GH.branch};
  if(sha)body.sha=sha;
  const r=await ghReq('PUT','/contents/'+enc,body);
  if(!r.ok)throw {status:r.status};
}
function ghErr(e){
  const s=e&&e.status;
  if(s===401)return 'الـ Token غلط أو منتهي. اعمل واحد جديد وحطه في تبويب الربط.';
  if(s===403)return 'الـ Token معندوش صلاحية الكتابة. لازم Contents: Read and write على المستودع ده.';
  if(s===404)return 'المستودع أو الفرع مش موجود. راجع الاسم في تبويب الربط.';
  if(s===409||s===422)return 'حصل تعارض مع تعديل تاني. اضغط حفظ ونشر تاني.';
  return 'مفيش اتصال أو حصلت مشكلة. حاول تاني.';
}
async function publishAll(){
  if(A.busy)return;
  if(!GH.repo||!GH.token){A.tab='link';renderBody();setState('اربط GitHub الأول من تبويب الربط.',true);return;}
  const m=validate();if(m){setState(m,true);return;}
  A.busy=true;const sb=$('#adm-save');sb.disabled=true;
  try{
    const data=cleanData();
    const stamp=Date.now().toString(36);
    for(let i=0;i<data.products.length;i++){
      const p=data.products[i];
      if(p.img.indexOf('data:image/')===0){
        setState('جاري رفع الصور ('+(i+1)+'/'+data.products.length+')…');
        const path='img/'+(p.id.replace(/[^\w\-]/g,'')||'p')+'-'+stamp+'.jpg';
        await putFile(path,p.img.split(',')[1],'Add product image');
        W.products[i].pv=p.img;W.products[i].img=path;p.img=path;
      }
    }
    setState('جاري نشر التعديل…');
    await putFile('store-data.json',b64utf8(JSON.stringify(data)),'Update store');
    setState('اتنشر ✓ هيظهر على الرابط خلال دقيقة أو اتنين.');
  }catch(e){setState(ghErr(e),true);}
  A.busy=false;sb.disabled=false;
}
function openAdmin(){const a=$('#adm');if(!a)return;a.hidden=false;document.body.classList.add('lock');renderBody();const c=$('#adm-close');if(c)c.focus();}
function closeAdmin(){const a=$('#adm');if(a)a.hidden=true;document.body.classList.remove('lock');const f=$('.admin-fab');if(f)f.focus();}

function buildAdmin(){
  loadGH();
  W={s:clone(S),products:clone(P)};
  const fab=document.createElement('button');fab.type='button';fab.className='admin-fab';fab.textContent='لوحة التحكم';
  const panel=document.createElement('section');
  panel.className='adm';panel.id='adm';panel.hidden=true;panel.dir='rtl';panel.lang='ar';
  panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');panel.setAttribute('aria-label','لوحة التحكم');
  panel.innerHTML='<header class="adm-head"><div class="adm-in"><h2>لوحة التحكم</h2><div class="adm-act"><span class="adm-state" id="adm-state" role="status"></span><button type="button" class="btn primary" id="adm-save" data-a="save">حفظ ونشر</button><button type="button" class="icon-btn" id="adm-close" data-a="close" aria-label="إغلاق">×</button></div></div></header>'
    +'<nav class="adm-tabs"><div class="adm-in"><button type="button" data-a="tab" data-tab="products">المنتجات</button><button type="button" data-a="tab" data-tab="settings">الإعدادات</button><button type="button" data-a="tab" data-tab="link">الربط</button></div></nav>'
    +'<div class="adm-body" id="adm-body"></div>';
  app.appendChild(fab);app.appendChild(panel);
  fab.addEventListener('click',openAdmin);
  panel.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
    const a=b.getAttribute('data-a');
    const row=b.closest('[data-i]');const i=row?+row.getAttribute('data-i'):-1;
    const p=A.edit>=0?W.products[A.edit]:null;
    if(a==='close'){closeAdmin();return;}
    if(a==='save'){publishAll();return;}
    if(a==='savelink'){saveGH();setState('اتحفظ الربط على الجهاز ده.');return;}
    if(a==='tab'){A.tab=b.getAttribute('data-tab');A.del=false;renderBody();return;}
    if(a==='add'){
      W.products.push(normProduct({n:{ar:'',en:''},price:0,sizes:['S','M','L','XL'],colors:[{n:{ar:'أسود',en:'Black'},hex:'#171A24'}]}));
      A.edit=W.products.length-1;A.del=false;markDirty();renderBody();
      const f=$('#ef-nar');if(f)f.focus();return;
    }
    if(a==='edit'&&i>=0){A.edit=i;A.del=false;renderBody();return;}
    if(a==='back'){A.edit=-1;A.del=false;renderBody();return;}
    if((a==='up'||a==='down')&&i>=0){
      const j=a==='up'?i-1:i+1;
      if(j>=0&&j<W.products.length){const x=W.products[i];W.products[i]=W.products[j];W.products[j]=x;markDirty();renderBody();}
      return;
    }
    if(!p)return;
    if(a==='rmimg'){p.img='';p.pv='';markDirty();renderBody();}
    else if(a==='addclr'){if(p.colors.length<10){p.colors.push({n:{ar:'',en:''},hex:'#171A24'});markDirty();renderBody();}}
    else if(a==='rmclr'){const r=b.closest('[data-ci]');if(r){p.colors.splice(+r.getAttribute('data-ci'),1);markDirty();renderBody();}}
    else if(a==='del'){
      if(!A.del){A.del=true;renderBody();}
      else{W.products.splice(A.edit,1);A.edit=-1;A.del=false;markDirty();renderBody();}
    }
  });
  panel.addEventListener('input',e=>{
    const el=e.target;
    if(el.getAttribute('data-f')){
      const p=W.products[A.edit];if(!p)return;
      const f=el.getAttribute('data-f');let v=el.type==='checkbox'?el.checked:el.value;
      if(f==='sizes')v=parseSizes(v);
      else if(f==='price')v=Math.max(0,Math.round(Number(digits(v).replace(/[^\d.]/g,''))||0));
      setPath(p,f,v);markDirty();
    }else if(el.getAttribute('data-c')){
      const p=W.products[A.edit];const r=el.closest('[data-ci]');if(!p||!r)return;
      const c=p.colors[+r.getAttribute('data-ci')];if(!c)return;
      setPath(c,el.getAttribute('data-c'),el.value);markDirty();
    }else if(el.getAttribute('data-s')){
      setPath(W.s,el.getAttribute('data-s'),el.type==='checkbox'?el.checked:el.value);markDirty();
    }else if(el.getAttribute('data-g')){
      const k=el.getAttribute('data-g'),v=el.value.trim();
      if(k==='token'){if(v)GH.token=v;}else GH[k]=v;
    }
  });
  panel.addEventListener('change',async e=>{
    const el=e.target;
    if(el.id==='ef-img'&&el.files&&el.files[0]){
      const p=W.products[A.edit];if(!p)return;
      setState('جاري تجهيز الصورة…');
      try{p.img=await toDataUrl(el.files[0]);p.pv='';markDirty();renderBody();}
      catch(err){setState('الصورة دي مش مدعومة. جرّب JPG أو PNG.',true);}
    }
  });
  A.built=true;
}
function syncAdmin(){
  const want=location.hash==='#admin';
  if(!A.built){if(!want)return;buildAdmin();}
  const fab=$('.admin-fab'),panel=$('#adm');
  if(fab)fab.hidden=!want;
  if(!want&&panel&&!panel.hidden)closeAdmin();
  if(want&&panel&&panel.hidden&&!A.opened){A.opened=true;openAdmin();}
}

/* ---------- boot ---------- */
function refresh(){applyHero();loadCart();applyLang();}
setData(EMBED);refresh();
const FETCH_MS=4000;
(function(){
  let done=false;
  function finish(){if(done)return;done=true;syncAdmin();}
  setTimeout(finish,FETCH_MS);
  try{
    fetch('store-data.json?v='+Date.now(),{cache:'no-store'})
      .then(r=>r.ok?r.json():null)
      .then(j=>{if(j&&Array.isArray(j.products)){setData(j);refresh();}})
      .catch(()=>{})
      .then(finish);
  }catch(e){finish();}
})();
window.addEventListener('hashchange',()=>{if(A.built||location.hash==='#admin')syncAdmin();});
})();
